<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Veille sélective du droit du travail en France : presse, lois et décrets publiés, textes envisagés." />
    <title>Sociactus — Veille en droit social</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div><p class="eyebrow">Veille juridique française</p><h1>Sociactus</h1></div>
      <p id="run-status" class="run-status">Chargement…</p>
    </header>
    <main class="shell">
      <section class="main-content" aria-labelledby="journal-title">
        <div class="intro"><p class="eyebrow">Droit social · cabinet</p><h2 id="journal-title">Veille du jour</h2><p id="journal-intro">Lois et décrets publiés, textes envisagés et presse concernant le droit du travail en France.</p></div>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Type d’information">
            <button type="button" data-filter="all" aria-pressed="true">Tout</button>
            <button type="button" data-filter="regle" aria-pressed="false">Lois et décrets</button>
            <button type="button" data-filter="projet-loi" aria-pressed="false">Textes envisagés</button>
            <button type="button" data-filter="presse" aria-pressed="false">Presse</button>
          </div>
          <label class="search">Rechercher <input id="search-input" type="search" placeholder="Sujet, texte, mot-clé" /></label>
        </div>
        <p id="result-count" class="result-count"></p>
        <div id="entry-list" class="entry-list"></div>
      </section>
      <aside class="archive" aria-label="Éditions précédentes"><details><summary>Archives</summary><div id="day-list" class="day-list"></div></details></aside>
    </main>
    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
