<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sociactus, journal quotidien de veille et de curation du droit social en France."
    />
    <title>Sociactus - Journal du droit social</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Veille sociale française</p>
        <h1>Sociactus</h1>
      </div>
      <div class="run-status" id="run-status">Chargement du journal...</div>
    </header>

    <main class="shell">
      <aside class="sidebar" aria-label="Volet latéral de veille">
        <div class="panel">
          <div class="panel-title">Journal</div>
          <div id="day-list" class="day-list"></div>
        </div>
        <div class="panel convention-panel side-admin-panel">
          <div class="panel-title">Conventions collectives</div>
          <p id="convention-status" class="panel-note">Chargement...</p>
          <label class="admin-token">
            <span>Jeton admin</span>
            <input id="admin-token" type="password" autocomplete="current-password" placeholder="Coller le jeton" />
          </label>
          <div id="convention-list" class="convention-list"></div>
          <button id="save-conventions" class="admin-save" type="button">Enregistrer les priorités</button>
        </div>
        <div class="panel source-panel">
          <div class="panel-title">Sources</div>
          <ul id="source-list"></ul>
        </div>
      </aside>

      <section class="workspace">
        <section class="summary-band" aria-labelledby="journal-title">
          <div>
            <p class="eyebrow">Edition du jour</p>
            <h2 id="journal-title">Journal de veille</h2>
          </div>
          <div class="metrics" id="metrics"></div>
        </section>

        <section class="toolbar" aria-label="Filtres de veille">
          <div class="filter-row">
            <label class="search-box">
              <span>Rechercher</span>
              <input id="search-input" type="search" placeholder="ex. CSE, SMIC, licenciement" />
            </label>
            <div class="segments priority-segments" role="group" aria-label="Rang de priorité">
              <button class="segment active" data-priority="p1" type="button" aria-pressed="true">P1</button>
              <button class="segment" data-priority="p2" type="button" aria-pressed="false">P2</button>
              <button class="segment" data-priority="p3" type="button" aria-pressed="false">P3</button>
              <button class="segment" data-priority="all" type="button" aria-pressed="false">Tous rangs</button>
            </div>
            <div class="segments" role="group" aria-label="Type d'information">
              <button class="segment active" data-filter="all" type="button" aria-pressed="true">Tout</button>
              <button class="segment" data-filter="regle" type="button" aria-pressed="false">Règles</button>
              <button class="segment" data-filter="jurisprudence" type="button" aria-pressed="false">Jurisprudence</button>
              <button class="segment" data-filter="projet-loi" type="button" aria-pressed="false">Projets</button>
              <button class="segment" data-filter="actualite" type="button" aria-pressed="false">Actualités</button>
              <button class="segment" data-filter="presse" type="button" aria-pressed="false">Presse</button>
            </div>
          </div>
          <div class="filter-status" aria-live="polite">
            <div id="result-count" class="result-count">0 résultat</div>
            <div id="active-filters" class="active-filters"></div>
            <button id="reset-filters" class="reset-filters" type="button">Réinitialiser</button>
          </div>
        </section>

        <section id="entry-list" class="entry-list" aria-live="polite"></section>
      </section>
    </main>

    <template id="entry-template">
      <article class="entry-card">
        <div class="entry-head">
          <div>
            <div class="entry-meta"></div>
            <h3></h3>
          </div>
          <div class="entry-flags">
            <span class="priority-badge"></span>
            <span class="impact"></span>
          </div>
        </div>
        <p class="summary"></p>
        <p class="priority-reason"></p>
        <details class="detail-panel">
          <summary>Détails opérationnels</summary>
          <div class="detail-grid">
            <div>
              <span class="field-label">Application</span>
              <p class="application"></p>
            </div>
            <div>
              <span class="field-label">Point de vigilance</span>
              <p class="watch"></p>
            </div>
          </div>
        </details>
        <div class="themes"></div>
        <div class="entry-actions">
          <a class="source-link" target="_blank" rel="noreferrer">Source officielle</a>
        </div>
      </article>
    </template>

    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
